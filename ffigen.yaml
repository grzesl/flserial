# Run with `dart run ffigen --config ffigen.yaml`.
name: FlserialBindings
description: |
  Bindings for `src/flserial.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: "lib/flserial_bindings_generated.dart"
headers:

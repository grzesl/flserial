name: flserial
description: "Flutter Serial Port Plugin FFI based on great C library. Useful to communicate with RS232 devices."
version: 0.6.0
homepage: https://github.com/grzesl/flserial

flutter:
  plugin:
    platforms:
      android:
        package: io.github.grzesl.flserial
        pluginClass: FlserialPlugin

environment:
  sdk: ^3.11.3
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^1.0.0
  ffi: ^2.2.0
  hooks: ^1.0.0
  logging: ^1.3.0
  native_assets_cli: ^0.18.0
  native_toolchain_c: ^0.17.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0


ffigen:
  name: FLSerialBindings
  description: 'Automatycznie wygenerowane bindowania dla sterownika SerialPort C++'
  output: 'lib/flserial_port_bindings.dart'
  headers:
    entry-points:
      - 'src/flserial.h'

  functions:
    include:
      - InitDartApiDL
      - serial_.*
      - register_port

  comments: true